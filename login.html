<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FandomVerse | Login</title>
    <link rel="stylesheet" href="CSS/loginstyle.css">
</head>

<body>

    <img src="RSC/IMGS/ANIME.jpeg" alt="Background" class="bg-static-image">

    <div class="overlay"></div>

    <div class="main-login-wrapper">
        
        <div class="left-side-slider">
            <img src="RSC/IMGS/login_anime.png" class="side-slide active" alt="Slide 1">
            <img src="RSC/IMGS/login_movies.png" class="side-slide" alt="Slide 2">
            <img src="RSC/IMGS/login_games.png" class="side-slide" alt="Slide 3">
            <div class="slider-overlay"></div>
        </div>

        <div class="right-side-form">
            <h1>FandomVerse | Login</h1>

            <form id="loginForm">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Username" required>
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <button type="button" id="loginBtn">Login</button>
                <button type="button" id="createBtn">Create Account</button>
            </form>
        </div>
    </div>

    <script src="JS/loginscript.js"></script>
</body>
</html>
